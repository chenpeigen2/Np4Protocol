name: np4_client
description: Np4Protocol cross-platform anonymous chat client (Windows, macOS, Linux, Android).
publish_to: "none"
version: 0.1.0

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  ffi: ^2.2.0
  path_provider: ^2.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.14.4
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

# Unified NP4 brand icon (generated by clients/tools/gen_icon.py).
flutter_launcher_icons:
  image_path: "assets/icon-1024.png"
  adaptive_icon_background: "#0A0F1C"
  adaptive_icon_foreground: "assets/icon-1024-fg.png"
  android: true
  min_sdk_android: 21
