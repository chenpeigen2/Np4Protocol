name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  go:
    name: Go — vet, race, np4, fuzz seeds
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: go
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum
      - name: apt deps (none today, placeholder for future cgo needs)
        run: echo "go job uses no system packages"
      - name: Vet
        run: go vet ./...
      - name: Race — light packages
        # TestMDNSDiscovery is environment-flaky on CI runners (mDNS).
        run: >-
          go test -race -count=1
          -skip 'TestMDNSDiscovery'
          ./pkg/identity/ ./pkg/auth/ ./pkg/cell/ ./pkg/onion/
          ./pkg/mix/ ./pkg/message/ ./pkg/pathsel/ ./pkg/bridge/
          ./pkg/p2p/ ./cmd/bootstrap/
      - name: np4 — full suite
        run: go test -count=1 ./pkg/np4/
      - name: Fuzz — seed corpora
        run: >-
          go test -count=1 -run 'Fuzz'
          ./pkg/cell/ ./pkg/onion/ ./pkg/pathsel/ ./pkg/auth/
      - name: Build
        run: go build ./...
      - name: Release binaries (linux/amd64, stripped)
        run: >-
          CGO_ENABLED=0 go build -ldflags="-s -w" -o dist/bootstrap ./cmd/bootstrap/ &&
          CGO_ENABLED=0 go build -ldflags="-s -w" -o dist/np4cli ./cmd/np4cli/
      - uses: actions/upload-artifact@v4
        with:
          name: np4-linux-binaries
          path: go/dist/
          retention-days: 14

  flutter:
    name: Flutter — analyze, test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: clients/flutter
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  flutter-release:
    name: Flutter — release APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: clients/flutter
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - uses: android-actions/setup-android@v3
      - uses: actions/setup-go@v5
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum
      # Point the native build at the runner's preinstalled NDK (the
      # script's default probe is macOS-specific); install one if absent.
      - name: Locate Android NDK
        run: |
          NDK=$(ls -d ${ANDROID_HOME:-/usr/local/lib/android/sdk}/ndk/* 2>/dev/null | sort -V | tail -1 || true)
          if [ -z "$NDK" ]; then
            yes | sdkmanager --install "ndk;27.0.12077973" >/dev/null
            NDK=$(ls -d ${ANDROID_HOME:-/usr/local/lib/android/sdk}/ndk/* | sort -V | tail -1)
          fi
          echo "ANDROID_NDK_HOME=$NDK" >> "$GITHUB_ENV"
      # Native libs are gitignored: rebuild them for the APK.
      - name: Build native libs (android)
        run: ./tool/build_native.sh android
      - run: flutter pub get
      - run: flutter build apk --release --split-per-abi
      - uses: actions/upload-artifact@v4
        with:
          name: np4-release-apks
          path: clients/flutter/build/app/outputs/flutter-apk/*-release.apk
          retention-days: 14

  pyqt:
    name: PyQt — compile + import smoke
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: clients/pyqt
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # Headless Linux needs the GL/EGL system libraries for PyQt6.QtWidgets.
      - name: apt deps for Qt
        run: sudo apt-get update && sudo apt-get install -y libgl1 libegl1
      - run: pip install PyQt6
      - run: python -m compileall -q .
      - name: Import smoke (offscreen)
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -c "import main; print('UI module imports clean')"
